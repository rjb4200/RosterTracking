name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Serialize runs so parallel jobs cannot collide on the shared test databases.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Non-production only. Production credentials must never be present here.
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Next generates the PageProps/route types that tsc needs; without this a
      # clean checkout fails typecheck because .next/types does not exist yet.
      - run: npx next typegen
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Integration tests
        # Runs only when a non-production test database secret is configured.
        if: ${{ env.TEST_DATABASE_URL != '' }}
        run: npm run db:reset:integration && npm run test:integration
